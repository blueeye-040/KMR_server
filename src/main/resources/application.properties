# ── Server ────────────────────────────────────────────────────
spring.application.name=kmr-marketplace
server.port=8080

# ── Supabase PostgreSQL ───────────────────────────────────────
# Go to Supabase → Project Settings → Database → Connection string (JDBC)
# Replace [YOUR-PROJECT-REF] and [YOUR-DB-PASSWORD]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP ─────────────────────────────────────────────────
# Supabase uses PgBouncer (transaction mode) which does not support
# server-side prepared statements. Setting prepareThreshold=0 forces
# the JDBC driver to use simple query protocol, avoiding the
# "prepared statement S_x already exists" error that poisons pool connections.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
# Change this secret in production — must be at least 32 chars
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ── AWS ───────────────────────────────────────────────────────
# Values come from .env — do not hardcode here
aws.access-key-id=${ACCESS_KEY}
aws.secret-access-key=${SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.cloudfront.domain=${CLOUDFRONT_DOMAIN}

# ── OTP / SMS ─────────────────────────────────────────────────
# Set to false when AWS SNS credentials are ready
app.sms.dev-mode=${DEV_MODE:true}

# ── Payments (Razorpay) ───────────────────────────────────────
# Leave blank to run checkout in dev mode (payments auto-succeed, no live keys).
# Add real keys to .env to switch to the live Razorpay gateway.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Vendor payout split (Razorpay Route):
#   HOLD = hold the vendor's product money until the order is delivered, then release
#          (delivery fee goes to the platform immediately). Safer for cancellations.
#   SPOT = split immediately on payment.
razorpay.split-mode=${PAYMENT_SPLIT_MODE:HOLD}

# ── Email (AWS SES) ───────────────────────────────────────────
# Blank = dev mode (emails are logged, not sent). Set a VERIFIED SES sender to go live.
app.mail.from=${MAIL_FROM:}

# ── Push (FCM) ────────────────────────────────────────────────
# Path to the Firebase service-account JSON. Blank = dev mode (pushes are logged).
fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}
