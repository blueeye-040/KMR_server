# ── Server ────────────────────────────────────────────────────
spring.application.name=kmr-marketplace
server.port=8080

# ── Supabase PostgreSQL ───────────────────────────────────────
# Go to Supabase → Project Settings → Database → Connection string (JDBC)
# Replace [YOUR-PROJECT-REF] and [YOUR-DB-PASSWORD]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
# Change this secret in production — must be at least 32 chars
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ── AWS ───────────────────────────────────────────────────────
# Values come from .env — do not hardcode here
aws.access-key-id=${ACCESS_KEY}
aws.secret-access-key=${SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-south-1}

# ── OTP / SMS ─────────────────────────────────────────────────
# Set to false when AWS SNS credentials are ready
app.sms.dev-mode=${DEV_MODE:true}
